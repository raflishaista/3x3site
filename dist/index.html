<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#080808"><meta name="description" content=""><title>3×3 — your collections</title><link rel="stylesheet" href="style.css"></head><body><header><nav aria-label="Main"><a href="#/" id="home-link">home</a><a href="#/edit" id="edit-link">edit</a></nav><a class="wordmark" href="#/" aria-label="3 by 3 home">3<span>×</span>3</a></header><main id="app"></main><footer><span>3×3 / a personal index</span><span id="storage-note"></span></footer><dialog id="crop-dialog"><form method="dialog"><div class="dialog-head"><h2>Edit image</h2><button value="cancel" aria-label="Close image editor">×</button></div></form><div id="crop-stage" tabindex="0" role="img" aria-label="Image crop. Drag to reposition or use arrow keys."><img id="crop-image" alt="Image being cropped" draggable="false"></div><p class="hint">Drag to position. Arrow keys also work.</p><label class="zoom-label">Zoom <input id="zoom" type="range" min="0.25" max="3" step="0.01" value="1"><output id="zoom-value">100%</output></label><div class="crop-actions"><button id="replace-image">Replace image</button><button id="reset-crop">Reset</button><button id="apply-crop" class="primary">Use image</button></div><p id="crop-error" role="alert"></p></dialog><input type="file" accept="image/*" id="file-input" hidden><div id="notice" role="status"></div><script src="app.js"></script></body></html>
